name: learning-assessment-production

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: runtime
    env_file:
      - /opt/learning-assessment/.env
    environment:
      APP_ENV: production
      CLIENT_LOG_PATH: /var/log/learning-assessment/client-errors.jsonl
      REPOSITORY_BACKEND: postgres
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - /opt/learning-assessment/logs:/var/log/learning-assessment
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--no-sync",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 15s
      timeout: 5s
      retries: 8

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: worker
    command: ["uv", "run", "--no-sync", "python", "-m", "app.worker"]
    env_file:
      - /opt/learning-assessment/.env
    environment:
      APP_ENV: production
      CODEX_HOME: /var/lib/learning-assessment-codex
      REPOSITORY_BACKEND: postgres
    volumes:
      - /opt/learning-assessment/codex:/var/lib/learning-assessment-codex
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.5
    stop_grace_period: 30s
