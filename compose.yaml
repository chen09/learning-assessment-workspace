name: learning-assessment-workspace

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/workspace/apps/web
      - web_node_modules:/workspace/node_modules
      - web_next_cache:/workspace/apps/web/.next
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment: &api-environment
      APP_ENV: local
      REPOSITORY_BACKEND: ${REPOSITORY_BACKEND:-memory}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@host.docker.internal:54322/postgres}
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      CHILD_SESSION_SECRET: ${CHILD_SESSION_SECRET:-local-development-only-change-me}
      AI_PROVIDER: ${AI_PROVIDER:-fixture}
      CODEX_EXECUTABLE: ${CODEX_EXECUTABLE:-codex}
      CODEX_MODEL: ${CODEX_MODEL:-}
      CODEX_TIMEOUT_SECONDS: ${CODEX_TIMEOUT_SECONDS:-180}
      AI_MINIMUM_CONFIDENCE: ${AI_MINIMUM_CONFIDENCE:-0.75}
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--no-sync",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: worker
    command: ["uv", "run", "--no-sync", "python", "-m", "app.worker"]
    environment: *api-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  web_node_modules:
  web_next_cache:
